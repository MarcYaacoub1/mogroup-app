
name: Build AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "Missing KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "Missing KEY_ALIAS secret"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "Missing KEY_PASSWORD secret"
            exit 1
          }

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Set up Gradle wrapper
        working-directory: MOGroupApp
        run: chmod +x gradlew

      - name: Build signed Release AAB
        working-directory: MOGroupApp
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB exists
        shell: bash
        run: |
          set -euo pipefail
          test -s MOGroupApp/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: MOGroup-release-aab
          path: MOGroupApp/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
